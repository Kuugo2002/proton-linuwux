name: Test LinUwUx patch compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-patches:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test BPF backend source layouts
        run: python3 -m unittest discover -s tests -v
